name: Build Android Executable

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: false

    - name: Run ndk-build
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        echo "NDK Path: $ANDROID_NDK_HOME"
        ls -l libs/arm64-v8a/

        # ===== 字体嵌入：ttf/otf 转成 C 数组头文件 =====
        which xxd || sudo apt-get install -y xxd
        mkdir -p include/My_font
        (cd fonts && xxd -i AgencyFB-Bold.ttf > ../include/My_font/AgencyFB_Bold.h)
        (cd fonts && xxd -i MaterialIcons-Regular.otf > ../include/My_font/MaterialIcons_Regular.h)

        # NDK_LIBS_OUT 换目录，防止 ndk-build 清空 libs/ 里的 libparadise_api.a
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_LIBS_OUT=./build_out

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-hack
        path: build_out/
